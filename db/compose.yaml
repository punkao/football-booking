# Database project (NFR-23 · ADR-10). Start this first: it creates the network football-net and the volume football-pgdata.
#   docker compose -f db/compose.yaml up -d
# NEVER use `down -v` (it deletes the volume = every booking). `docker compose -f db/compose.yaml down` (no -v) is safe.
name: football-db

services:
  db:
    image: postgres:16-alpine
    container_name: football-db
    env_file: .env              # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB (copy .env.example → .env)
    environment:
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
    ports:
      - "127.0.0.1:5433:5432"   # host only (psql / DBeaver for [E sql:] checks)
    volumes:
      - football-pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro   # 01-schema.sql (= migrations) + 02-seed.sql, first start only
      - ./migrations:/migrations:ro
      - ./scripts:/scripts:ro
      - ./backups:/backups                      # pg_dump files (not in git)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - football-net
    restart: unless-stopped

networks:
  football-net:
    name: football-net

volumes:
  football-pgdata:
    name: football-pgdata
