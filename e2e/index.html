  --accent: #8ab4f8; --chip: #252a31;

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 "Sarabun", "Noto Sans Thai", "Leelawadee UI", system-ui, sans-serif; }
main { max-width: 1400px; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font-size: 1.5rem; margin: 0 0 4px; }

a { color: var(--accent); }

.small { font-size: .85rem; }

.head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-weight: 600; font-size: .85rem; background: var(--chip); }
.badge.mode0 { background: var(--pass-bg); color: var(--pass); }
.badge.mode1 { background: var(--fail-bg); color: var(--fail); }
.boxes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 16px; }
.box { background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--fail); border-radius: 10px; padding: 14px 16px; }
.box.ok { border-left-color: var(--pass); }
.box h3 { margin: 0; font-size: 1rem; text-transform: capitalize; display: flex; justify-content: space-between; gap: 8px; }
.verdict { font-weight: 700; }
.ok .verdict { color: var(--pass); }
.box:not(.ok) .verdict { color: var(--fail); }
.box .big { font-size: 1.6rem; font-weight: 700; margin: 6px 0 0; font-variant-numeric: tabular-nums; }
.box ul { margin: 6px 0 0; padding-left: 18px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
.panel p { margin: 6px 0; }
.claims { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 760px) { .claims { grid-template-columns: 1fr; } }
.claims li { margin: 4px 0; }
.links { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
.filters input[type=search], .filters select { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); }
.filters input[type=search] { flex: 1 1 220px; min-width: 0; }
.filters label { display: inline-flex; gap: 6px; align-items: center; }
.tablewrap { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { position: sticky; top: 0; background: var(--panel); font-size: .85rem; color: var(--muted); z-index: 1; }
td.id { white-space: nowrap; font-weight: 600; }
td.exp { max-width: 380px; font-size: .88rem; }
td.st { white-space: nowrap; text-align: center; }
.st span { display: inline-block; min-width: 2.2em; padding: 1px 8px; border-radius: 6px; font-weight: 600; }
.s-passed { background: var(--pass-bg); color: var(--pass); }
.s-failed { background: var(--fail-bg); color: var(--fail); }
.s-skipped, .s-notrun { background: var(--warn-bg); color: var(--warn); }
.src { display: block; font-size: .72rem; color: var(--muted); font-weight: 400; }
.prio { font-weight: 700; }
.prio.P1 { color: var(--fail); }
tr.tri td { background: var(--fail-bg); font-size: .88rem; border-bottom: 2px solid var(--line); }
.tri .cls { font-weight: 700; }
details summary { cursor: pointer; color: var(--accent); }
pre.err { white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: .78rem; margin: 6px 0 0; color: var(--text); }
.ev a { margin-right: 6px; white-space: nowrap; }
.flips td, .flips th { padding: 4px 8px; }
@media (max-width: 760px) {
  .tablewrap { background: transparent; border: 0; overflow: visible; }
  table.cases thead { display: none; }
  table.cases, table.cases tbody, table.cases tr, table.cases td { display: block; width: 100%; }
  table.cases tr.tc { background: var(--panel); border: 1px solid var(--line); border-radius: 10px 10px 0 0; margin-top: 12px; padding: 6px 0; }
  table.cases tr.tc.last { border-radius: 10px; }
  table.cases tr.tri { border: 1px solid var(--line); border-top: 0; border-radius: 0 0 10px 10px; overflow: hidden; }
  table.cases td { border: 0; padding: 3px 12px; max-width: none; text-align: left; }
  table.cases td[data-l]::before { content: attr(data-l) " · "; color: var(--muted); font-size: .8rem; }
  table.cases td.st { display: inline-block; width: auto; padding-right: 4px; }
  table.cases td.st::before { content: attr(data-l) " "; }
}
</style>

function boxes(sum, small) {
  return B.map((b) => {
    const s = sum[b];
    const fails = s.failed.length ? `<ul class="small">${s.failed.map((t) => `<li><a href="#${t}">${t}</a>${s.notRun.includes(t) ? ' (ข้าม/ไม่ได้รัน = ไม่ผ่าน)' : ''}</li>`).join('')}</ul>` : '<p class="small muted">ไม่มีข้อที่ล้ม</p>';
    return `<div class="box ${s.meets ? 'ok' : ''}">
      <h3><span>${b}</span><span class="verdict">${s.meets ? '✅ ผ่านเกณฑ์' : '❌ ไม่ผ่านเกณฑ์'}</span></h3>
      <p class="big">${s.pass}<span class="muted small"> / ${s.total} ผ่าน (ต้อง ≥ ${s.need})</span></p>
      <p class="small">P1 ผ่าน <b>${s.p1pass}/${s.p1total}</b> ${s.p1pass === s.p1total ? '✅' : '❌ (ต้องครบ)'} · ผ่านรวม ${s.pass >= s.need ? '✅' : '❌'} ${(100 * s.pass / s.total).toFixed(1)}%</p>
      ${small ? '' : `<details${s.failed.length && s.failed.length <= 12 ? ' open' : ''}><summary class="small">ไม่ผ่าน ${s.failed.length} ข้อ</summary>${fails}</details>`}
    </div>`;
  }).join('');
}

function cell(r, b) {
  const x = r.res[b];
  const src = x.src === 'serial' ? (b === 'chromium' ? 'serial' : 'นับจาก serial') : x.src.startsWith('perf') ? `perf${x.loadMs ? ' ' + x.loadMs + ' ms' : ''}` : '';
  const title = x.error ? ` title="${esc(x.error)}"` : '';
  return `<td class="st" data-l="${b}"><span class="s-${x.status}"${title}>${ST[x.status]}</span>${src ? `<span class="src">${src}</span>` : ''}</td>`;
}

function rows(list) {
  return list.map((r, i) => {
    const failing = B.some((b) => r.res[b].status !== 'passed');
    const ev = [
      ...r.gifs.map((g, k) => `<a href="${esc(g)}" target="_blank">GIF${r.gifs.length > 1 ? k + 1 : ''}</a>`),
      ...r.mp4s.map((g, k) => `<a href="${esc(g)}" target="_blank">MP4${r.mp4s.length > 1 ? k + 1 : ''}</a>`),
      r.mcpImage ? `<a href="${esc(r.mcpImage)}" target="_blank">ภาพ MCP${r.mcpVerdict && r.mcpVerdict !== '✅' ? ' ' + esc(r.mcpVerdict) : ''}</a>` : '',
    ].filter(Boolean).join(' ') || '<span class="muted">–</span>';
    const exp = r.expected.length > 170
      ? `<details><summary>${esc(r.expectedShort)}</summary>${esc(r.expected)}${r.reasoning ? `<p class="muted">วิธีคิด: ${esc(r.reasoning)}</p>` : ''}</details>`
      : `${esc(r.expected)}${r.reasoning ? `<div class="muted small">วิธีคิด: ${esc(r.reasoning)}</div>` : ''}`;
    let tri = '';
    if (failing) {
      const t = r.triage;
      const errB = B.find((b) => r.res[b].error);
      const failedIn = B.filter((b) => r.res[b].status !== 'passed').map((b) => `${b}${r.res[b].status === 'notrun' ? ' (ไม่ได้รัน)' : r.res[b].status === 'skipped' ? ' (ข้าม)' : ''}`).join(', ');
      tri = `<tr class="tri" data-k="${esc(r.id)}"><td colspan="9">
        <span class="cls">${t ? esc(t.class) : 'ยังไม่ได้จำแนก'}</span> · ไม่ผ่านใน ${esc(failedIn)}${t?.note ? `<div>${esc(t.note)}</div>` : ''}
        ${errB ? `<details><summary class="small">ข้อความ error (${errB})</summary><pre class="err">${esc(r.res[errB].error)}</pre></details>` : ''}
      </td></tr>`;
    }
    return `<tr class="tc${failing ? '' : ' last'}" id="${esc(r.id)}" data-k="${esc(r.id)}">
      <td class="id" data-l="รหัส">${esc(r.id)}</td>
      <td data-l="สิ่งที่ทดสอบ">${esc(r.title)}<div class="muted small">${esc(r.module)} · ${esc(r.technique)}</div></td>
      <td data-l="ระดับ"><span class="prio ${esc(r.priority)}">${esc(r.priority)}</span></td>
      <td data-l="ที่มา" class="small">${esc(r.source)}</td>
      <td data-l="เฉลย" class="exp">${exp}</td>
      ${B.map((b) => cell(r, b)).join('')}
      <td data-l="หลักฐาน" class="ev small">${ev}</td>
    </tr>${tri}`;
  }).join('');
}

      <a href="${esc(d.links.html)}">Playwright HTML report</a>
      <a href="${esc(d.links.plan)}">แผน 09-TEST-PLAN.md</a>
      <a href="${esc(d.links.cases)}">TEST-CASES.md (เฉลย)</a>
      <a href="${esc(d.links.mcp)}">TEST-RUN-MCP.md</a>
    </div>
    <p>GIF ${d.counts.gif} ไฟล์ · MP4 ${d.counts.mp4} ไฟล์ (จาก <span class="mono">npm run test:gif</span> = Chromium + serial + perf-chromium · TC ที่ยิง API อย่างเดียวไม่มีวิดีโอ) · ภาพ MCP ${d.rows.filter((r) => r.mcpImage).length} ภาพ</p>
    <p class="muted">project ที่รัน: ${d.runAts.map((r) => `${esc(r.project)} ${r.n} test (${fmt(r.runAt)})`).join(' · ')}</p>
  </div>

  <h2>ทุก TC (${d.rows.length})</h2>
  <div class="filters">
    <input type="search" id="q" placeholder="ค้นหา รหัส / สิ่งที่ทดสอบ / เฉลย" aria-label="ค้นหา">
    <select id="mod" aria-label="โมดูล"><option value="">ทุกโมดูล</option>${mods.map((m) => `<option>${m}</option>`).join('')}</select>
    <select id="pr" aria-label="ระดับ"><option value="">ทุกระดับ</option><option>P1</option><option>P2</option><option>P3</option></select>
    <label><input type="checkbox" id="fo"> เฉพาะที่ไม่ผ่าน</label>
    <span id="cnt" class="muted small"></span>
  </div>
  <div class="tablewrap">
    <table class="cases">
      <thead><tr><th>รหัส</th><th>สิ่งที่ทดสอบ</th><th>ระดับ</th><th>ที่มา</th><th>เฉลย</th><th>chromium</th><th>firefox</th><th>webkit</th><th>GIF · MP4 · MCP</th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>`;
  const apply = () => {
    const q = document.getElementById('q').value.trim().toLowerCase();
    const mo = document.getElementById('mod').value, pr = document.getElementById('pr').value, fo = document.getElementById('fo').checked;
    const list = d.rows.filter((r) => (!mo || r.module === mo) && (!pr || r.priority === pr) &&
      (!fo || B.some((b) => r.res[b].status !== 'passed')) &&
      (!q || `${r.id} ${r.title} ${r.expected} ${r.source}`.toLowerCase().includes(q)));
    document.getElementById('tb').innerHTML = rows(list);
    document.getElementById('cnt').textContent = `แสดง ${list.length} / ${d.rows.length}`;
  };
  ['q', 'mod', 'pr', 'fo'].forEach((id) => document.getElementById(id).addEventListener('input', apply));
  apply();
}
render();
</script>
</body>
</html>
