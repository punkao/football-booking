# Two containers only (07-SAD section 2): football-db + football-web
name: football-booking

services:
  db:
    image: postgres:16-alpine
    container_name: football-db
    environment:
      POSTGRES_USER: football
      POSTGRES_PASSWORD: football
      POSTGRES_DB: football
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
    volumes:
      - football-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football -d football"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    image: football-web:latest
    container_name: football-web
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://football:football@db:5432/football
      TZ: Asia/Bangkok
      HOSTNAME: 0.0.0.0
      ALLOW_TEST_RESET: "1"
      BUG_MODE: ${BUG_MODE:-0}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../docs:/app/project/docs:ro
      - ../e2e/test-report:/app/project/test-report:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>r.json()).then(j=>process.exit(j.ok&&j.db?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    restart: unless-stopped

volumes:
  football-db-data:
    name: football-db-data
